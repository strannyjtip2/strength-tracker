<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F7F4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Сила" />
  <meta name="description" content="Дневник силы — учёт подтягиваний и брусьев с весом. Работает без интернета." />
  <title>Дневник силы</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <style>
    :root {
      --bg: #F7F7F4;
      --card: #FFFFFF;
      --line: #E4E4DE;
      --text: #111111;
      --muted: #5F5F59;
      --faint: #8A8A84;
      --accent: #0C7A4C;
      --accent-dim: #E3F4EC;
      --accent-ink: #FFFFFF;
      --danger: #C0362C;
      --danger-dim: #F8E8E6;
      --track: #E8E8E2;
      --pad: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", "Inter", "PT Sans", "Roboto", "Noto Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      min-height: 100%;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body { padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
    button, input { font: inherit; color: inherit; }
    button {
      background: none; border: 0; cursor: pointer;
      -webkit-user-select: none; user-select: none;
    }
    .app { min-height: 100dvh; }
    .page { padding: 16px var(--pad) 32px; max-width: 430px; margin: 0 auto; }

    .hdr {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 20px; min-height: 44px;
    }
    .hdr h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.04em; line-height: 1.15; }
    .icon-btn {
      width: 44px; height: 44px; flex: 0 0 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px; color: var(--text);
    }
    .icon-btn:active { background: var(--line); }
    .icon-btn svg { width: 22px; height: 22px; }
    .back {
      display: flex; align-items: center; gap: 4px;
      min-height: 44px; margin: 0 0 0 -8px; padding: 0 8px 0 4px;
      font-size: 16px; font-weight: 500; color: var(--text);
    }
    .back svg { width: 22px; height: 22px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 16px;
    }
    .card + .card, .stack > * + * { margin-top: 12px; }
    .card-tap { width: 100%; text-align: left; display: block; color: inherit; }
    .card-tap:active { background: #F3F3EF; }

    .ex-name { font-size: 15px; font-weight: 550; color: var(--muted); margin-bottom: 8px; }
    .pair {
      font-size: 18px; font-weight: 600; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums; line-height: 1.3;
    }
    .pair .sep { color: var(--faint); font-weight: 500; }
    .bar {
      height: 12px; background: var(--track); border-radius: 99px; overflow: hidden;
      margin: 14px 0 10px;
    }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; }
    .left {
      font-size: 16px; font-weight: 600; color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .left.done { color: var(--accent); }
    .left.none { color: var(--muted); font-weight: 500; }

    .empty-hero { padding: 28px 20px 24px; text-align: left; }
    .empty-hero h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; margin-bottom: 8px; }
    .empty-hero p { font-size: 16px; color: var(--muted); line-height: 1.45; margin-bottom: 20px; }

    .btn {
      display: flex; align-items: center; justify-content: center;
      min-height: 52px; padding: 0 16px; border-radius: 14px;
      font-size: 17px; font-weight: 600; width: 100%;
    }
    .btn:disabled { opacity: 0.35; pointer-events: none; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); }
    .btn-primary:active { filter: brightness(0.95); }
    .btn-ghost { background: #EEEDE8; color: var(--text); }
    .btn-ghost:active { background: #E3E3DD; }
    .btn-danger { background: var(--danger-dim); color: var(--danger); }
    .add-goal {
      margin-top: 16px; min-height: 48px; font-size: 16px; font-weight: 600; color: var(--accent);
      width: 100%;
    }

    .hero {
      text-align: center; font-size: 56px; font-weight: 650;
      letter-spacing: -0.05em; font-variant-numeric: tabular-nums;
      line-height: 1; padding: 8px 0 18px;
    }
    .hero span { font-size: 22px; font-weight: 550; letter-spacing: 0; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .step {
      min-height: 52px; border-radius: 14px; background: #EEEDE8;
      font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .step:active { background: #E3E3DD; }
    .reps-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 14px;
    }
    .reps-row .lbl { font-size: 16px; color: var(--muted); font-weight: 500; }
    .stepper {
      display: flex; align-items: center; background: #EEEDE8; border-radius: 14px; overflow: hidden;
    }
    .stepper button { width: 48px; height: 48px; font-size: 22px; line-height: 1; font-weight: 500; }
    .stepper button:active { background: #E3E3DD; }
    .stepper .val {
      width: 52px; text-align: center; font-size: 22px; font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .sec { font-size: 13px; font-weight: 600; color: var(--faint); margin: 22px 0 8px; letter-spacing: 0.02em; }
    .chart-wrap { padding: 4px 0 0; }
    .chart-wrap svg { display: block; width: 100%; height: 88px; }
    .chart-cap {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; margin-top: 2px;
    }

    .btn-text {
      min-height: 44px; width: 100%; margin-top: 4px;
      font-size: 16px; font-weight: 600; color: var(--accent);
    }
    .btn-text:disabled { opacity: 0.35; pointer-events: none; color: var(--muted); }

    .today { list-style: none; }
    .today li {
      display: grid;
      grid-template-columns: 1.6em minmax(0, 1fr) 36px;
      column-gap: 4px;
      align-items: center;
      min-height: 40px; font-size: 16px;
      border-top: 1px solid var(--line); color: var(--text);
    }
    .today li:first-child { border-top: 0; }
    .today .n { color: var(--faint); font-variant-numeric: tabular-nums; }
    .today .w { font-variant-numeric: tabular-nums; font-weight: 550; }
    .today .del, .hist .del {
      width: 36px; height: 36px; color: var(--faint);
      display: flex; align-items: center; justify-content: center;
      justify-self: end;
    }
    .today .del:active, .hist .del:active { color: var(--danger); }

    .hist { list-style: none; }
    .hist li {
      display: grid;
      grid-template-columns: 7.2em minmax(0, 1fr);
      column-gap: 12px;
      align-items: start;
      padding: 9px 0;
      font-size: 14px;
      border-top: 1px solid var(--line); color: var(--text);
    }
    .hist li:first-child { border-top: 0; padding-top: 0; }
    .hist .d { color: var(--muted); padding-top: 1px; }
    .hist .w {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 550;
      line-height: 1.4;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      min-height: 44px; padding: 0 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card);
      color: var(--text); font-size: 15px; font-weight: 500;
    }
    .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    .field input[type="text"],
    .field input[type="number"] {
      width: 100%; height: 52px; padding: 0 14px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; font-size: 18px; font-weight: 550; color: var(--text);
      outline: none; font-variant-numeric: tabular-nums;
    }
    .field input:focus { border-color: var(--accent); }
    .help { font-size: 14px; color: var(--muted); line-height: 1.45; margin: 0 0 16px; }
    .row-actions { display: grid; gap: 8px; }
    .goal-edit {
      display: flex; gap: 16px; margin-top: 20px;
    }
    .goal-edit button { font-size: 14px; font-weight: 500; color: var(--muted); min-height: 40px; }
    .goal-edit .danger { color: var(--danger); }

    .modal-bg {
      position: fixed; inset: 0; z-index: 50; background: rgba(20,20,16,0.4);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal {
      width: 100%; max-width: 430px; background: var(--card);
      border-radius: 16px 16px 0 0; padding: 20px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    }
    .modal h2 { font-size: 18px; font-weight: 650; margin-bottom: 8px; }
    .modal p { font-size: 15px; color: var(--muted); line-height: 1.45; margin-bottom: 16px; }
    .toast {
      position: fixed; left: 20px; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 40; max-width: 390px; margin: 0 auto;
      background: #1A1A18; color: #FFF; border-radius: 12px; padding: 12px 14px; font-size: 14px;
    }
    .hidden-file { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
  const STORE_KEY = "strength-tracker-v1";
  const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  const BUILTIN = [
    { id: "pullups", name: "Подтягивания", builtin: true },
    { id: "dips", name: "Брусья", builtin: true }
  ];

  let db;
  let ui = {
    screen: "home",
    entryGoalId: null,
    weight: 20,
    reps: 5,
    goalForm: null,
    modal: null,
    toast: ""
  };
  let toastTimer = null;

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function parseISO(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtDate(s, withYear) {
    const d = parseISO(s);
    let out = d.getDate() + " " + MONTHS[d.getMonth()];
    if (withYear || d.getFullYear() !== new Date().getFullYear()) out += " " + d.getFullYear();
    return out;
  }
  function fmtDateShort(s) {
    const d = parseISO(s);
    return d.getDate() + " " + MONTHS_SHORT[d.getMonth()];
  }
  function fmtNum(n) {
    if (n == null || Number.isNaN(n)) return "—";
    const r = Math.round(n * 10) / 10;
    const neg = r < 0;
    const abs = Math.abs(r);
    const i = Math.floor(abs + 1e-9);
    const frac = Math.round((abs - i) * 10);
    const core = frac === 0 ? String(i) : i + "," + frac;
    return (neg ? "−" : "") + core;
  }
  function fmtKg(n, sign) {
    const s = fmtNum(n);
    if (s === "—") return s;
    return (sign && n > 0 ? "+" : "") + s + " кг";
  }
  function uid(prefix) {
    return prefix + "_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function escAttr(s) { return esc(s).replace(/"/g, "&quot;"); }

  function exerciseById(id) { return (db.exercises || []).find(e => e.id === id); }
  function exerciseName(id) { const e = exerciseById(id); return e ? e.name : "Упражнение"; }
  function goalById(id) { return (db.goals || []).find(g => g.id === id); }

  function setsOf(exerciseId) {
    const out = [];
    for (const w of db.workouts || []) {
      for (const s of w.sets) {
        if (s.exerciseId === exerciseId) out.push({ ...s, date: w.date, workoutId: w.id });
      }
    }
    return out;
  }
  function qualifies(set, goal) {
    if (goal && goal.reps && goal.reps > 1) return set.reps >= goal.reps;
    return true;
  }
  function bestLifted(goal) {
    let best = null;
    for (const s of setsOf(goal.exerciseId)) {
      if (!qualifies(s, goal)) continue;
      if (!best || s.weight > best.weight) best = s;
    }
    return best;
  }
  function lastSetOf(exerciseId) {
    const sets = setsOf(exerciseId);
    return sets.length ? sets[sets.length - 1] : null;
  }
  function todaysSets(exerciseId) {
    const date = todayISO();
    const w = (db.workouts || []).find(x => x.date === date);
    if (!w) return [];
    return w.sets.map((s, i) => ({ ...s, i, workoutId: w.id, date }))
      .filter(s => s.exerciseId === exerciseId);
  }
  function historyDays(exerciseId, excludeToday) {
    const today = todayISO();
    const days = {};
    const order = [];
    for (const w of db.workouts || []) {
      if (excludeToday && w.date === today) continue;
      const sets = (w.sets || []).filter(s => s.exerciseId === exerciseId);
      if (!sets.length) continue;
      if (!days[w.date]) { days[w.date] = []; order.push(w.date); }
      sets.forEach(s => days[w.date].push(s));
    }
    return order.sort().reverse().map(date => ({ date, sets: days[date] }));
  }
  function dailyBest(goal) {
    const map = {};
    for (const s of setsOf(goal.exerciseId)) {
      if (!qualifies(s, goal)) continue;
      if (!map[s.date] || s.weight > map[s.date]) map[s.date] = s.weight;
    }
    return Object.keys(map).sort().map(date => ({ date, value: map[date] }));
  }

  function defaultGoals() {
    return [
      { id: "g_pull", exerciseId: "pullups", weight: 90, reps: null },
      { id: "g_dips", exerciseId: "dips", weight: 72, reps: null }
    ];
  }
  function buildDemoWorkouts() {
    const dates = [
      "2026-08-11","2026-08-15","2026-08-18","2026-08-22","2026-08-25","2026-08-29",
      "2026-09-01","2026-09-05","2026-09-08","2026-09-12","2026-09-15","2026-09-19",
      "2026-09-22","2026-09-26","2026-09-29","2026-10-03","2026-10-06","2026-10-10",
      "2026-10-13","2026-10-17","2026-10-20","2026-10-24","2026-10-27","2026-10-31",
      "2026-11-03","2026-11-07","2026-11-10","2026-11-14","2026-11-17","2026-11-20"
    ];
    function round25(n) { return Math.round(n / 2.5) * 2.5; }
    const workouts = [];
    dates.forEach((date, i) => {
      const t = i / (dates.length - 1);
      const deload = (i === 16 || i === 17);
      const test = (date === "2026-11-10");
      let p5 = round25(42.5 + 15 * t);
      let p3 = round25(47.5 + 17.5 * t);
      let p1 = test ? 75 : (i > 24 ? 72.5 : 0);
      let d5 = round25(30 + 15 * t);
      let d3 = round25(35 + 17.5 * t);
      let d1 = test ? 57.5 : (i > 24 ? 55 : 0);
      if (deload) { p5 -= 5; p3 -= 5; d5 -= 5; d3 -= 5; p1 = 0; d1 = 0; }
      p5 = Math.max(30, p5); p3 = Math.max(p5 + 2.5, p3);
      d5 = Math.max(20, d5); d3 = Math.max(d5 + 2.5, d3);
      const sets = [];
      sets.push({ exerciseId: "pullups", weight: p5, reps: 5 });
      if (!test) sets.push({ exerciseId: "pullups", weight: round25((p5 + p3) / 2), reps: 4 });
      sets.push({ exerciseId: "pullups", weight: p3, reps: 3 });
      if (p1) sets.push({ exerciseId: "pullups", weight: p1, reps: 1 });
      sets.push({ exerciseId: "dips", weight: d5, reps: 5 });
      if (!test) sets.push({ exerciseId: "dips", weight: round25((d5 + d3) / 2), reps: 4 });
      sets.push({ exerciseId: "dips", weight: d3, reps: 3 });
      if (d1) sets.push({ exerciseId: "dips", weight: d1, reps: 1 });
      workouts.push({ id: "w_" + date, date, sets });
    });
    return workouts;
  }
  function seedDemo() {
    return {
      version: 1,
      demo: true,
      exercises: BUILTIN.map(e => ({ ...e })),
      goals: defaultGoals(),
      bodyweight: [
        { date: "2026-08-10", kg: 82.4 },
        { date: "2026-09-14", kg: 81.6 },
        { date: "2026-10-20", kg: 81.0 },
        { date: "2026-11-18", kg: 80.6 }
      ],
      workouts: buildDemoWorkouts()
    };
  }
  function emptyDb() {
    return {
      version: 1,
      demo: false,
      exercises: BUILTIN.map(e => ({ ...e })),
      goals: [],
      bodyweight: [],
      workouts: []
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return emptyDb();
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.workouts) || !Array.isArray(data.goals)) return emptyDb();
      if (!Array.isArray(data.exercises) || !data.exercises.length) {
        data.exercises = BUILTIN.map(e => ({ ...e }));
      }
      if (!Array.isArray(data.bodyweight)) data.bodyweight = [];
      data.workouts.forEach(w => { if (!Array.isArray(w.sets)) w.sets = []; });
      return data;
    } catch (e) {
      return emptyDb();
    }
  }
  function save() {
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
  }

  function goHome() {
    ui.screen = "home";
    ui.goalForm = null;
    ui.entryGoalId = null;
    ui.modal = null;
    render();
    window.scrollTo(0, 0);
  }
  function openEntry(goalId) {
    const g = goalById(goalId);
    if (!g) return;
    ui.entryGoalId = goalId;
    ui.screen = "entry";
    const last = lastSetOf(g.exerciseId);
    ui.weight = last ? last.weight : 20;
    ui.reps = last ? last.reps : 5;
    ui.modal = null;
    render();
    window.scrollTo(0, 0);
  }
  function openSettings() { ui.screen = "settings"; ui.modal = null; render(); window.scrollTo(0, 0); }
  function showToast(text) {
    ui.toast = text;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { ui.toast = ""; render(); }, 2000);
  }
  function openModal(modal) { ui.modal = modal; render(); }
  function closeModal() { ui.modal = null; render(); }

  function bumpWeight(d) {
    ui.weight = Math.max(0, Math.round((Number(ui.weight) + d) * 10) / 10);
    render();
  }
  function bumpReps(d) {
    ui.reps = Math.max(1, Math.min(30, (Number(ui.reps) || 1) + d));
    render();
  }
  function recordSet() {
    const g = goalById(ui.entryGoalId);
    if (!g) return;
    const weight = Math.round(Number(ui.weight) * 10) / 10;
    const reps = Math.round(Number(ui.reps));
    if (!(weight >= 0) || !(reps >= 1)) return;
    const date = todayISO();
    db.workouts = db.workouts || [];
    let w = db.workouts.find(x => x.date === date);
    if (!w) {
      w = { id: uid("w"), date, sets: [] };
      db.workouts.push(w);
      db.workouts.sort((a, b) => a.date.localeCompare(b.date));
    }
    w.sets.push({ exerciseId: g.exerciseId, weight, reps });
    db.demo = false;
    save();
    showToast("Записано");
  }
  function deleteSetAt(workoutId, index) {
    const w = (db.workouts || []).find(x => x.id === workoutId);
    if (!w || index < 0 || index >= w.sets.length) return;
    w.sets.splice(index, 1);
    if (!w.sets.length) db.workouts = db.workouts.filter(x => x.id !== w.id);
    save();
    render();
  }
  function repeatLast() {
    const g = goalById(ui.entryGoalId);
    if (!g) return;
    const last = lastSetOf(g.exerciseId);
    if (!last) return;
    ui.weight = last.weight;
    ui.reps = last.reps;
    recordSet();
  }

  function openGoalForm(id) {
    if (id) {
      const g = goalById(id);
      if (!g) return;
      const ex = exerciseById(g.exerciseId);
      ui.goalForm = {
        id: g.id,
        exerciseId: g.exerciseId,
        customName: ex && !ex.builtin ? ex.name : "",
        useCustom: !!(ex && !ex.builtin),
        weight: g.weight
      };
    } else {
      ui.goalForm = { id: null, exerciseId: "pullups", customName: "", useCustom: false, weight: 90 };
    }
    ui.screen = "goal-form";
    render();
    window.scrollTo(0, 0);
  }
  function readGoalForm() {
    if (!ui.goalForm) return;
    const n = document.getElementById("gf-name");
    const w = document.getElementById("gf-w");
    if (n) ui.goalForm.customName = n.value;
    if (w) ui.goalForm.weight = w.value;
  }
  function saveGoal() {
    const f = ui.goalForm;
    if (!f) return;
    let exerciseId = f.exerciseId;
    if (f.useCustom) {
      const name = String(f.customName || "").trim();
      if (!name) { showToast("Укажите название"); return; }
      const existing = db.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
      if (existing) exerciseId = existing.id;
      else {
        exerciseId = uid("ex");
        db.exercises.push({ id: exerciseId, name, builtin: false });
      }
    }
    const weight = Number(String(f.weight).replace(",", "."));
    if (!(weight > 0)) { showToast("Укажите целевой вес"); return; }
    const reps = f.id ? ((goalById(f.id) && goalById(f.id).reps) || null) : null;
    if (f.id) {
      const g = goalById(f.id);
      if (g) { g.exerciseId = exerciseId; g.weight = weight; }
      ui.entryGoalId = f.id;
      ui.goalForm = null;
      openEntry(f.id);
    } else {
      const dup = (db.goals || []).find(x => x.exerciseId === exerciseId);
      if (dup) {
        dup.weight = weight;
        ui.goalForm = null;
        openEntry(dup.id);
      } else {
        const id = uid("g");
        db.goals.push({ id, exerciseId, weight, reps: null });
        ui.goalForm = null;
        openEntry(id);
      }
    }
    save();
  }
  function deleteGoal(id) {
    const g = goalById(id);
    if (!g) return;
    openModal({
      title: "Удалить цель?",
      text: "Цель «" + exerciseName(g.exerciseId) + " " + fmtKg(g.weight, true) + "» будет удалена. Подходы останутся.",
      confirm: "Удалить",
      danger: true,
      onConfirm: () => {
        db.goals = db.goals.filter(x => x.id !== id);
        save();
        ui.modal = null;
        goHome();
      }
    });
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "dnevnik-sily-" + todayISO() + ".json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.workouts) || !Array.isArray(data.goals)) {
          showToast("Файл не похож на копию дневника");
          return;
        }
        db = data;
        if (!Array.isArray(db.exercises) || !db.exercises.length) db.exercises = BUILTIN.map(e => ({ ...e }));
        if (!Array.isArray(db.bodyweight)) db.bodyweight = [];
        save();
        showToast("Данные загружены");
        goHome();
      } catch (e) {
        showToast("Не удалось прочитать файл");
      }
    };
    reader.readAsText(file);
  }
  function resetAll() {
    openModal({
      title: "Сбросить всё?",
      text: "Будут удалены тренировки и цели. Это нельзя отменить.",
      confirm: "Сбросить",
      danger: true,
      onConfirm: () => {
        db = emptyDb();
        save();
        ui.modal = null;
        showToast("Данные сброшены");
        goHome();
      }
    });
  }

  function sparkline(points) {
    if (!points.length) return "";
    const w = 350, h = 88;
    const pad = { l: 4, r: 8, t: 10, b: 10 };
    const ys = points.map(p => p.value);
    let min = Math.min(...ys), max = Math.max(...ys);
    if (max === min) { min = Math.max(0, min - 5); max = max + 5; }
    const spanY = max - min;
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    const t0 = parseISO(points[0].date).getTime();
    const t1 = parseISO(points[points.length - 1].date).getTime();
    const span = Math.max(t1 - t0, 86400000);
    const xOf = d => pad.l + ((parseISO(d).getTime() - t0) / span) * iw;
    const yOf = v => pad.t + (1 - (v - min) / spanY) * ih;
    const path = points.map((p, i) => (i ? "L" : "M") + xOf(p.date).toFixed(1) + " " + yOf(p.value).toFixed(1)).join(" ");
    const last = points[points.length - 1];
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<path d="' + path + '" fill="none" stroke="#0C7A4C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + xOf(last.date).toFixed(1) + '" cy="' + yOf(last.value).toFixed(1) + '" r="3.5" fill="#0C7A4C"/>' +
      '</svg><div class="chart-cap"><span>' + fmtDateShort(points[0].date) + '</span><span>' + fmtKg(last.value, true) + " · " + fmtDateShort(last.date) + "</span></div></div>";
  }

  const ICO = {
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
    x: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>'
  };

  function renderHome() {
    let body = "";
    if (!db.goals.length) {
      body = '<section class="card empty-hero"><h2>Пока пусто</h2><p>Поставьте цель, например «Подтягивания +90 кг».</p><button type="button" class="btn btn-primary" data-act="new-goal">+ цель</button></section>';
    } else {
      for (const g of db.goals) {
        const best = bestLifted(g);
        const now = best ? best.weight : 0;
        const pct = g.weight > 0 && best ? Math.max(0, Math.min(100, (now / g.weight) * 100)) : 0;
        const left = g.weight - now;
        const done = best && left <= 0;
        const pair = best
          ? "лучший " + fmtKg(now, true) + ' <span class="sep">/</span> цель ' + fmtKg(g.weight, true)
          : "цель " + fmtKg(g.weight, true);
        const leftText = !best ? "ещё нет подходов" : (done ? "цель достигнута" : "осталось " + fmtKg(left));
        body += '<button type="button" class="card card-tap" data-act="open" data-id="' + g.id + '">' +
          '<div class="ex-name">' + esc(exerciseName(g.exerciseId)) + "</div>" +
          '<div class="pair">' + pair + "</div>" +
          '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
          '<div class="left' + (done ? " done" : (best ? "" : " none")) + '">' + leftText + "</div></button>";
      }
      body += '<button type="button" class="add-goal" data-act="new-goal">+ цель</button>';
    }
    return '<header class="hdr"><h1>Дневник силы</h1><button type="button" class="icon-btn" data-act="settings" aria-label="Настройки">' + ICO.gear + "</button></header>" + body;
  }

  function fmtSetCompact(s) {
    const sign = s.weight > 0 ? "+" : "";
    return sign + fmtNum(s.weight) + "×" + s.reps;
  }
  function renderEntry() {
    const g = goalById(ui.entryGoalId);
    if (!g) return renderHome();
    const points = dailyBest(g);
    const today = todaysSets(g.exerciseId);
    const last = lastSetOf(g.exerciseId);
    let todayHtml = "";
    if (today.length) {
      todayHtml = '<div class="sec">Сегодня</div><ul class="today">' + today.map((s, n) => {
        return '<li><span class="n">' + (n + 1) + '.</span><span class="w">' + fmtKg(s.weight, true) + " × " + s.reps +
          '</span><button type="button" class="del" data-act="del-set" data-wid="' + s.workoutId + '" data-i="' + s.i + '" aria-label="Удалить подход">' + ICO.x + "</button></li>";
      }).join("") + "</ul>";
    }
    const hist = historyDays(g.exerciseId, true).slice(0, 12);
    let histHtml = "";
    if (hist.length) {
      histHtml = '<div class="sec">История</div><ul class="hist">' + hist.map(day => {
        const line = day.sets.map(fmtSetCompact).join(", ");
        return '<li><span class="d">' + fmtDate(day.date) + '</span><span class="w">' + line + "</span></li>";
      }).join("") + "</ul>";
    }
    const chart = points.length ? '<div class="sec">Лучший вес</div><section class="card" style="padding:12px 14px 10px">' + sparkline(points) + "</section>" : "";
    return '<header class="hdr"><button type="button" class="back" data-act="home">' + ICO.back + esc(exerciseName(g.exerciseId)) + '</button><button type="button" class="icon-btn" data-act="edit-goal" data-id="' + g.id + '" aria-label="Изменить цель">' + ICO.pencil + "</button></header>" +
      '<div class="hero">' + fmtKg(ui.weight, true).replace(" кг", ' <span>кг</span>') + "</div>" +
      '<div class="grid-2">' +
        '<button type="button" class="step" data-act="w-minus">− 1</button>' +
        '<button type="button" class="step" data-act="w-plus">+ 1</button>' +
      "</div>" +
      '<div class="reps-row"><span class="lbl">Повторы</span><div class="stepper">' +
        '<button type="button" data-act="r-minus" aria-label="Меньше">−</button>' +
        '<div class="val">' + ui.reps + "</div>" +
        '<button type="button" data-act="r-plus" aria-label="Больше">+</button>' +
      "</div></div>" +
      '<div style="margin-top:18px"><button type="button" class="btn btn-primary" data-act="record">Записать</button>' +
        '<button type="button" class="btn-text" data-act="repeat"' + (last ? "" : " disabled") + ">Повторить последний</button></div>" +
      todayHtml + chart + histHtml;
  }

  function renderGoalForm() {
    const f = ui.goalForm;
    const title = f.id ? "Изменить цель" : "Новая цель";
    const builtins = (db.exercises || []).filter(e => e.builtin);
    const chips = builtins.map(e => '<button type="button" class="chip' + (!f.useCustom && f.exerciseId === e.id ? " on" : "") + '" data-act="gf-ex" data-id="' + e.id + '">' + esc(e.name) + "</button>").join("") +
      '<button type="button" class="chip' + (f.useCustom ? " on" : "") + '" data-act="gf-custom">Своё</button>';
    const custom = f.useCustom
      ? '<div class="field"><label for="gf-name">Название</label><input id="gf-name" type="text" maxlength="40" value="' + escAttr(f.customName) + '" placeholder="Название упражнения" /></div>'
      : "";
    return '<header class="hdr"><button type="button" class="back" data-act="' + (f.id ? "back-entry" : "home") + '">' + ICO.back + title + "</button></header>" +
      '<div class="field"><label>Упражнение</label><div class="chips">' + chips + "</div></div>" +
      custom +
      '<div class="field"><label for="gf-w">Цель, кг</label><input id="gf-w" type="number" inputmode="decimal" step="1" min="0" max="400" value="' + f.weight + '" /></div>' +
      '<div class="row-actions"><button type="button" class="btn btn-primary" data-act="save-goal">Сохранить</button>' +
      (f.id ? '<button type="button" class="btn btn-danger" data-act="del-goal" data-id="' + f.id + '">Удалить цель</button>' : "") +
      "</div>";
  }

  function renderSettings() {
    return '<header class="hdr"><button type="button" class="back" data-act="home">' + ICO.back + "Настройки</button></header>" +
      '<div class="row-actions">' +
        '<button type="button" class="btn btn-ghost" data-act="export">Скачать копию</button>' +
        '<button type="button" class="btn btn-ghost" data-act="import">Загрузить из файла</button>' +
        '<button type="button" class="btn btn-danger" data-act="reset">Сбросить всё</button>' +
      "</div>" +
      '<input id="import-file" class="hidden-file" type="file" accept="application/json,.json" />' +
      '<p class="help" style="margin-top:16px">Данные хранятся только на этом устройстве.</p>';
  }

  function render() {
    const root = document.getElementById("app");
    const focus = document.activeElement;
    const focusId = focus && focus.id;
    const selStart = focus && focus.selectionStart;
    const selEnd = focus && focus.selectionEnd;
    const pages = { home: renderHome, entry: renderEntry, "goal-form": renderGoalForm, settings: renderSettings };
    const body = (pages[ui.screen] || renderHome)();
    let extra = "";
    if (ui.modal) {
      extra += '<div class="modal-bg" data-act="close-modal"><div class="modal" data-stop="1"><h2>' + esc(ui.modal.title) + "</h2><p>" + esc(ui.modal.text) + '</p><div class="row-actions"><button type="button" class="btn ' + (ui.modal.danger ? "btn-danger" : "btn-primary") + '" data-act="modal-ok">' + esc(ui.modal.confirm || "ОК") + '</button><button type="button" class="btn btn-ghost" data-act="close-modal">Отмена</button></div></div></div>';
    }
    if (ui.toast) extra += '<div class="toast">' + esc(ui.toast) + "</div>";
    root.innerHTML = '<div class="page">' + body + "</div>" + extra;
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) {
        el.focus();
        try { if (selStart != null) el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }

  function onClick(e) {
    if (e.target.classList && e.target.classList.contains("modal-bg")) { closeModal(); return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.getAttribute("data-act");
    const id = el.getAttribute("data-id");
    if (act === "home") goHome();
    else if (act === "settings") openSettings();
    else if (act === "open") openEntry(id);
    else if (act === "new-goal") openGoalForm(null);
    else if (act === "edit-goal") openGoalForm(id);
    else if (act === "del-goal") deleteGoal(id);
    else if (act === "back-entry") openEntry(ui.entryGoalId);
    else if (act === "w-minus") bumpWeight(-1);
    else if (act === "w-plus") bumpWeight(1);
    else if (act === "r-minus") bumpReps(-1);
    else if (act === "r-plus") bumpReps(1);
    else if (act === "record") recordSet();
    else if (act === "repeat") repeatLast();
    else if (act === "del-set") deleteSetAt(el.getAttribute("data-wid"), Number(el.getAttribute("data-i")));
    else if (act === "save-goal") { readGoalForm(); saveGoal(); }
    else if (act === "gf-ex") { ui.goalForm.useCustom = false; ui.goalForm.exerciseId = id; readGoalForm(); render(); }
    else if (act === "gf-custom") { ui.goalForm.useCustom = true; readGoalForm(); render(); }
    else if (act === "export") exportData();
    else if (act === "import") document.getElementById("import-file").click();
    else if (act === "reset") resetAll();
    else if (act === "close-modal") closeModal();
    else if (act === "modal-ok") { const fn = ui.modal && ui.modal.onConfirm; if (fn) fn(); }
  }
  function onChange(e) {
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      importData(e.target.files[0]);
      e.target.value = "";
    }
  }

  window.__qa = {
    home() { goHome(); },
    empty() { db = emptyDb(); localStorage.removeItem(STORE_KEY); goHome(); },
    seed() { db = seedDemo(); save(); goHome(); },
    entry(exerciseId) {
      const g = (db.goals || []).find(x => x.exerciseId === (exerciseId || "pullups"));
      if (g) openEntry(g.id);
    },
    newGoal() { openGoalForm(null); },
    settings() { openSettings(); }
  };

  db = load();
  if (!db.exercises || !db.exercises.length) db.exercises = BUILTIN.map(e => ({ ...e }));
  document.getElementById("app").addEventListener("click", onClick);
  document.getElementById("app").addEventListener("change", onChange);
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
  }
  </script>
</body>
</html>
